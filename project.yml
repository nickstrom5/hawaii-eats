name: HawaiiEats
options:
  bundleIdPrefix: com.hawaiieats
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "4C8TU6U7MQ"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"  # iPhone and iPad
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  HawaiiEats:
    type: application
    platform: iOS
    sources:
      - path: HawaiiEats
    info:
      path: HawaiiEats/Info.plist
      properties:
        CFBundleDisplayName: Hawaiʻi Eats
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        UIUserInterfaceStyle: Light      # the palette is light-only (Design/Theme.swift); dark mode made lists unreadable
        NSLocationWhenInUseUsageDescription: "Your location sorts restaurants, plate lunch counters and shave ice stands by distance and shows where you are on the map. It stays on your device."
        ITSAppUsesNonExemptEncryption: false
        LSApplicationQueriesSchemes: [maps]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hawaiieats.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets: [HawaiiEatsTests, HawaiiEatsUITests]

  HawaiiEatsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HawaiiEatsTests
    dependencies:
      - target: HawaiiEats
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hawaiieats.ios.tests
        GENERATE_INFOPLIST_FILE: true

  HawaiiEatsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HawaiiEatsUITests
    dependencies:
      - target: HawaiiEats
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hawaiieats.ios.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: HawaiiEats
